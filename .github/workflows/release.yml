name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build Windows executable
        run: ./source/build.ps1
      - name: Verify executable
        run: |
          foreach ($test in @('--self-test','--settings-test')) {
            $process = Start-Process -FilePath ./CodexStrip.exe -ArgumentList $test -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "$test failed: $($process.ExitCode)" }
          }
      - name: Package portable downloads
        run: ./source/package.ps1
      - name: Publish release and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "Codex Strip $env:RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG CodexStrip.exe CodexStrip.exe.config dist/CodexStrip-portable.zip dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - name: Remove superseded publication
        if: github.ref == 'refs/tags/v0.1.2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v0.1.1 --yes
            if ($LASTEXITCODE -ne 0) { throw 'Old release deletion failed' }
          }
          gh api repos/gobunu/Codex-Strip/actions/runs/37753654104 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method DELETE repos/gobunu/Codex-Strip/actions/runs/37753654104
            if ($LASTEXITCODE -ne 0) { throw 'Old workflow run deletion failed' }
          }
          $global:LASTEXITCODE = 0
